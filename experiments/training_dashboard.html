<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DynFL 训练监控</title>
  <style>
    :root{color-scheme:dark;--bg:#08101b;--panel:#101b2a;--panel2:#142337;--line:#263851;--text:#edf4ff;--muted:#91a4bb;--cyan:#52d6c9;--blue:#66a8ff;--amber:#f6c667;--red:#ff7d7d;--green:#69dc9e;--purple:#ad8cff}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 0,#112c40 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
    main{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:600}.title{margin:6px 0 4px;font-size:clamp(25px,3vw,40px);line-height:1.1;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:13px;max-width:850px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.live{display:flex;align-items:center;gap:8px;background:rgba(16,27,42,.72);border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:13px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--green);box-shadow:0 0 0 5px rgba(105,220,158,.12)}
    .overview{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:14px;margin-bottom:14px}.card{background:linear-gradient(145deg,rgba(20,35,55,.94),rgba(13,24,38,.94));border:1px solid rgba(95,127,160,.25);border-radius:16px;padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.16)}.label{color:var(--muted);font-size:12px}.big{font-size:30px;line-height:1.1;margin-top:9px;font-variant-numeric:tabular-nums}.context{margin-top:7px;color:var(--muted);font-size:12px}.progress{height:7px;background:#213047;border-radius:99px;overflow:hidden;margin-top:16px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .5s ease}.active-card{position:relative;overflow:hidden}.active-card:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-80px;top:-90px;background:rgba(82,214,201,.08)}
    .grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);gap:14px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:15px}.section-head h2{font-size:16px;margin:0;font-weight:600}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.status{display:inline-flex;gap:7px;align-items:center;padding:5px 9px;border-radius:999px;background:rgba(105,220,158,.1);color:var(--green);font-size:12px}.status.completed{color:var(--blue);background:rgba(102,168,255,.1)}.status.failed,.status.interrupted{color:var(--red);background:rgba(255,125,125,.1)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}.metric{background:rgba(8,16,27,.42);padding:12px;border-radius:11px;min-width:0}.metric strong{display:block;font-size:20px;margin-top:5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chart{background:rgba(8,16,27,.3);border-radius:12px;padding:12px;min-height:230px}.chart-title{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:6px}.chart-title b{color:var(--text);font-weight:500}.chart svg{width:100%;height:190px;display:block}.axis{stroke:#33465f;stroke-width:1}.gridline{stroke:#25364c;stroke-width:1}.axis-label{fill:var(--muted);font-size:10px}.chart-line{fill:none;stroke:var(--cyan);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.chart-line.alt{stroke:var(--purple)}.point{fill:var(--panel);stroke:var(--cyan);stroke-width:2}.empty{height:190px;display:grid;place-items:center;color:var(--muted);font-size:13px}
    .runlist{max-height:620px;overflow:auto;padding-right:3px}.run{width:100%;text-align:left;color:inherit;background:transparent;border:0;border-top:1px solid rgba(85,113,144,.2);padding:13px 2px;display:grid;grid-template-columns:1fr auto;gap:7px 12px;font:inherit;cursor:pointer}.run:first-child{border-top:0}.run:hover,.run.selected{background:rgba(102,168,255,.07)}.run-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}.run-meta{font-size:11px;color:var(--muted);margin-top:3px}.run-pct{font-size:13px;font-variant-numeric:tabular-nums;color:var(--cyan)}.mini-progress{grid-column:1/-1;height:3px;border-radius:99px;overflow:hidden;background:#223147}.mini-progress i{display:block;height:100%;background:var(--blue)}
    .table-card{margin-top:14px;padding-bottom:8px}.table-wrap{overflow:auto;max-height:360px}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:var(--panel);color:var(--muted);text-align:left;font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid rgba(85,113,144,.15);font-variant-numeric:tabular-nums;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover{background:rgba(102,168,255,.06)}.right{text-align:right}.error{display:none;margin-bottom:14px;background:rgba(255,125,125,.1);color:#ffb4b4;border:1px solid rgba(255,125,125,.25);border-radius:12px;padding:12px;font-size:13px}
    @media(max-width:900px){main{padding:18px}.overview{grid-template-columns:1fr 1fr}.active-card{grid-column:1/-1}.grid{grid-template-columns:1fr}.runlist{max-height:360px}}@media(max-width:600px){.top{display:block}.live{margin-top:14px;width:max-content}.overview{grid-template-columns:1fr 1fr}.card{padding:14px}.metrics{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.subtitle{white-space:normal}.big{font-size:25px}}
  </style>
</head>
<body>
<main>
  <header class="top"><div><div class="eyebrow">Experiment observatory</div><h1 class="title">DynFL 训练监控</h1><div class="subtitle" id="root">正在连接运行目录…</div></div><div class="live"><span class="dot" id="live-dot"></span><span id="live-text">等待数据</span></div></header>
  <div class="error" id="error"></div>
  <section class="overview">
    <article class="card active-card"><div class="label">整体轮次进度</div><div class="big" id="overall">—</div><div class="context" id="overall-context">—</div><div class="progress"><div class="bar" id="overall-bar"></div></div></article>
    <article class="card"><div class="label">已完成运行</div><div class="big" id="completed-runs">—</div><div class="context" id="planned-runs">—</div></article>
    <article class="card"><div class="label">当前准确率</div><div class="big" id="headline-accuracy">—</div><div class="context" id="headline-dataset">—</div></article>
    <article class="card"><div class="label">预计剩余</div><div class="big" id="eta">—</div><div class="context">按本次运行实测速率粗略估计</div></article>
  </section>
  <section class="grid">
    <article class="card">
      <div class="section-head"><div><h2 id="active-name">等待运行</h2><p id="active-path">尚未发现状态文件</p></div><span class="status" id="active-status">未知</span></div>
      <div class="progress"><div class="bar" id="active-bar"></div></div>
      <div class="metrics">
        <div class="metric"><span class="label">轮次</span><strong id="rounds">—</strong></div>
        <div class="metric"><span class="label">测试损失</span><strong id="loss">—</strong></div>
        <div class="metric"><span class="label">最大 ε</span><strong id="epsilon">—</strong></div>
        <div class="metric"><span class="label">本轮参与</span><strong id="admitted">—</strong></div>
        <div class="metric"><span class="label">J_pred</span><strong id="jpred">—</strong></div>
        <div class="metric"><span class="label">J_obs</span><strong id="jobs">—</strong></div>
        <div class="metric"><span class="label">当前候选</span><strong id="candidate">—</strong></div>
        <div class="metric"><span class="label">ACK / pending</span><strong id="ack">—</strong></div>
        <div class="metric"><span class="label">本轮仿真 T</span><strong id="round-t">—</strong></div>
        <div class="metric"><span class="label">累计仿真 T</span><strong id="cumulative-t">—</strong></div>
      </div>
      <div class="charts"><div class="chart"><div class="chart-title"><b>测试准确率</b><span>轮次 →</span></div><div id="accuracy-chart"></div></div><div class="chart"><div class="chart-title"><b>测试损失</b><span>轮次 →</span></div><div id="loss-chart"></div></div></div>
    </article>
    <aside class="card"><div class="section-head"><div><h2>运行队列</h2><p>点击任一任务查看曲线</p></div></div><div class="runlist" id="runlist"></div></aside>
  </section>
  <section class="card table-card"><div class="section-head"><div><h2>最近结果</h2><p>每 5 秒从只读输出文件刷新</p></div><span class="label" id="refreshed">—</span></div><div class="table-wrap"><table><thead><tr><th>数据集</th><th>策略</th><th>Seed</th><th>状态</th><th class="right">轮次</th><th class="right">准确率</th><th class="right">损失</th><th class="right">最大 ε</th></tr></thead><tbody id="results"></tbody></table></div></section>
</main>
<script>
  const $=id=>document.getElementById(id); let selectedId=null, lastData=null;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct=v=>v==null?'—':`${(Number(v)*100).toFixed(2)}%`; const num=(v,d=3)=>v==null?'—':Number(v).toFixed(d);
  function duration(sec){if(sec==null||!isFinite(sec))return '—';if(sec<60)return `${Math.ceil(sec)} 秒`;if(sec<3600)return `${Math.ceil(sec/60)} 分`;if(sec<86400)return `${(sec/3600).toFixed(1)} 小时`;return `${(sec/86400).toFixed(1)} 天`}
  function statusLabel(s){return ({running:'运行中',completed:'已完成',failed:'失败',interrupted:'已中断',stale:'状态过期',queued:'排队中',paused:'已暂停'})[s]||s||'未知'}
  function svgChart(target,rows,key,format,alt=false){const host=$(target);const values=rows.filter(r=>r[key]!=null);if(!values.length){host.innerHTML='<div class="empty">暂无数据</div>';return}const W=620,H=190,p={l:48,r:16,t:12,b:27};let ys=values.map(r=>+r[key]),min=Math.min(...ys),max=Math.max(...ys);if(min===max){min-=Math.abs(min*.05)||1;max+=Math.abs(max*.05)||1}const pad=(max-min)*.08;min-=pad;max+=pad;const xmin=values[0].round,xmax=values[values.length-1].round;const x=v=>p.l+(v-xmin)/Math.max(1,xmax-xmin)*(W-p.l-p.r),y=v=>p.t+(max-v)/(max-min)*(H-p.t-p.b);const path=values.map((r,i)=>`${i?'L':'M'}${x(r.round).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<4;i++){let v=min+(max-min)*i/3,py=y(v);grid+=`<line class="gridline" x1="${p.l}" y1="${py}" x2="${W-p.r}" y2="${py}"/><text class="axis-label" x="${p.l-7}" y="${py+3}" text-anchor="end">${format(v)}</text>`}const last=values[values.length-1];host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${key} 随轮次变化"><line class="axis" x1="${p.l}" y1="${H-p.b}" x2="${W-p.r}" y2="${H-p.b}"/>${grid}<text class="axis-label" x="${p.l}" y="${H-7}">${xmin}</text><text class="axis-label" x="${W-p.r}" y="${H-7}" text-anchor="end">${xmax}</text><path class="chart-line ${alt?'alt':''}" d="${path}"/><circle class="point" cx="${x(last.round)}" cy="${y(last[key])}" r="4"><title>第 ${last.round} 轮：${format(last[key])}</title></circle></svg>`}
  function selectRun(id){selectedId=id;render(lastData)}
  function render(data){lastData=data;if(!data||!data.runs)return;const runs=data.runs;let active=runs.find(r=>r.id===selectedId)||runs.find(r=>r.status==='running')||runs[0];if(active)selectedId=active.id;$('root').textContent=data.root;$('completed-runs').textContent=data.completed_runs;$('planned-runs').textContent=`已发现 ${data.discovered_runs} / 计划 ${data.planned_runs} 项`;$('overall').textContent=pct(data.round_progress);$('overall-context').textContent=`${Object.entries(data.status_counts).map(([k,v])=>`${statusLabel(k)} ${v}`).join(' · ')||'尚无运行'}`;$('overall-bar').style.width=`${Math.min(100,data.round_progress*100)}%`;
    const hasRunning=runs.some(r=>r.status==='running');$('live-dot').className=`dot ${hasRunning?'on':''}`;$('live-text').textContent=hasRunning?'自动刷新中':'当前无活动运行';
    if(active){const l=active.latest||{};$('active-name').textContent=`${active.dataset} · ${active.policy} · seed ${active.seed}`;$('active-path').textContent=active.id;$('active-status').textContent=statusLabel(active.status);$('active-status').className=`status ${active.status}`;$('active-bar').style.width=`${Math.min(100,active.progress*100)}%`;$('rounds').textContent=`${active.completed_rounds} / ${active.total_rounds}`;$('loss').textContent=num(l.test_loss,4);$('epsilon').textContent=num(l.max_epsilon,3);$('admitted').textContent=l.admitted_clients==null?'—':Math.round(l.admitted_clients);$('jpred').textContent=num(l.predicted_j,3);$('jobs').textContent=num(l.observed_j,3);$('candidate').textContent=l.selected_candidate||'P0 / 初始化';$('ack').textContent=l.acknowledged_clients==null?'—':`${Math.round(l.acknowledged_clients)} / ${Math.round(l.pending_units||0)}`;$('round-t').textContent=num(l.round_duration,3);$('cumulative-t').textContent=num(l.system_time,3);$('headline-accuracy').textContent=pct(l.test_accuracy);$('headline-dataset').textContent=`${active.dataset} · ${active.policy}`;$('eta').textContent=active.status==='running'?duration(active.eta_sec):'—';svgChart('accuracy-chart',active.metrics,'test_accuracy',pct);svgChart('loss-chart',active.metrics,'test_loss',v=>num(v,3),true)}
    $('runlist').innerHTML=runs.map(r=>`<button class="run ${r.id===selectedId?'selected':''}" onclick="selectRun(${JSON.stringify(r.id).replace(/"/g,'&quot;')})"><span><div class="run-name">${esc(r.dataset)} · ${esc(r.policy)}</div><div class="run-meta">seed ${esc(r.seed)} · ${statusLabel(r.status)} · ${r.completed_rounds}/${r.total_rounds} 轮</div></span><span class="run-pct">${Math.round(r.progress*100)}%</span><span class="mini-progress"><i style="width:${Math.min(100,r.progress*100)}%"></i></span></button>`).join('')||'<div class="empty">尚未发现运行</div>';
    $('results').innerHTML=runs.map(r=>{const l=r.latest||{};return `<tr onclick="selectRun(${JSON.stringify(r.id).replace(/"/g,'&quot;')})"><td>${esc(r.dataset)}</td><td>${esc(r.policy)}</td><td>${esc(r.seed)}</td><td>${statusLabel(r.status)}</td><td class="right">${r.completed_rounds}/${r.total_rounds}</td><td class="right">${pct(l.test_accuracy)}</td><td class="right">${num(l.test_loss,4)}</td><td class="right">${num(l.max_epsilon,3)}</td></tr>`}).join('');$('refreshed').textContent=`刷新于 ${new Date().toLocaleTimeString()}`}
  let refreshing=false;
  async function refresh(){if(refreshing)return;refreshing=true;try{const response=await fetch('/api/status',{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);$('error').style.display='none';render(data)}catch(error){$('error').textContent=`读取监控数据失败：${error.message}`;$('error').style.display='block';$('live-dot').className='dot';$('live-text').textContent='连接中断'}finally{refreshing=false}}
  refresh();setInterval(refresh,5000);
</script>
</body>
</html>
